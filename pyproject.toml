[project]
name = "castor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.0",
    "click>=8.4.2",
    "fastapi>=0.139.0",
    "numpy>=2.4.4",
    "pydantic>=2.13.3",
    "pywebview>=6.2.1",
    "uvicorn>=0.51.0",
]

# The CLI has always been a real entry point; until now it could only be reached
# as `python -m castorCLI.main`, which is not what its own --help text describes.
# Installing a console script needs a build backend: without one uv treats this
# as a virtual project and builds no wheel to hang an entry point on.
[project.scripts]
castor = "castorCLI.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castor", "src/castorCLI", "src/castorGUI"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# validation/ compares CASTOR against outside references and is run on purpose,
# not on every commit — see validation/README.md.
testpaths = ["tests"]
markers = ["validation: compares CASTOR against an external reference"]
