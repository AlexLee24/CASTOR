<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASTOR ETC</title>

    <!-- The mark carries its own light plate rather than being bare line art:
         a favicon has no say in the theme it is drawn on, and black strokes on
         a transparent ground vanish against a dark tab strip. -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <!-- Providing Plotly is the host's job — etc.js only ever reads window.Plotly.
         This standalone build serves a vendored copy so it works offline and on a
         private observatory network; Kinder's template pins the same library from
         its own CDN tag instead. Both deferred: a blocking 3.4MB <script> in the
         head means the form doesn't render until the library has finished
         downloading, which on a slow link is several seconds of blank page. -->
    <script src="js/plotly.min.js" defer charset="utf-8"></script>
    <script src="js/etc.js" defer></script>
    <script src="js/etc_simple.js" defer></script>
    <link rel="stylesheet" href="css/etc.css">
    <!-- Kinder's own components, which Simple mode is built from. Kinder itself does
         not load this file: its _theme.css already defines them. -->
    <link rel="stylesheet" href="css/kinder_shim.css">
    <link rel="stylesheet" href="css/etc_simple.css">

    <script>
        // The host decides where the engine lives; server.py serves these paths
        // itself and Kinder points the same keys at its own blueprint.
        // Inline (not deferred) so it is in place before the deferred scripts run.
        window.CASTOR_ETC_CONFIG = {
            apiUrl: '/api/exposure_time_calculator',
            batchUrl: '/api/exposure_time_calculator/batch',
            presetsUrl: '/api/exposure_time_calculator/presets',
            quickUrl: '/api/exposure_time_calculator/quick'
        };
    </script>

    <!-- Page chrome for the standalone build only. Deliberately not in etc.css:
         mounted inside Kinder the page background, font and outer padding belong
         to the host, and the calculator must not reach outside .castor-etc. -->
    <!-- Kinder's typeface, so standalone reads like mounted. Only a nicety: offline
         the system stack below takes over and nothing else changes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@300;400;500;600;700&display=swap">

    <style>
        html {
            -webkit-font-smoothing: antialiased;
            color-scheme: dark;
            /* Kinder's fluid root size, which the rem-based sizes in both modes follow. */
            font-size: clamp(14px, calc(12.5px + 0.25vw), 16px);
        }
        body {
            margin: 0;
            /* border-box or the 32px of padding lands outside the 100vh and the page
               scrolls by exactly 64px on every screen, with nothing below the fold to
               scroll to. The shell already sizes itself to 100vh - 96px and each panel
               scrolls internally, so the outer page is not meant to scroll at all. */
            box-sizing: border-box;
            padding: 32px;
            min-height: 100vh;
            background: #07061A;   /* Kinder's --kw-bg */
            color: #F5F5F7;
            font-family: 'TASA Explorer', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
        }
        /* Both modes stand in the height left under the mode bar, which etc_simple.js
           measures into --etc-top; the bottom gap is this page's own padding. The
           Advanced override is the one line etc.css documents as the host's, the same
           one Kinder's template sets. */
        .etc-page { --etc-bottom-gap: 32px; }
        .etc-page .castor-etc {
            --etc-shell-height: clamp(420px, calc(100dvh - var(--etc-top, 120px) - var(--etc-bottom-gap)), 1150px);
        }
    </style>
</head>
<body>

<div class="etc-page">
    <div class="etc-mode-bar">
        <div class="kw-tabbar" role="tablist" aria-label="Calculator mode">
            <button type="button" class="kw-tab is-on" role="tab" aria-selected="true" data-etc-mode="simple">Simple</button>
            <button type="button" class="kw-tab" role="tab" aria-selected="false" data-etc-mode="advanced">Advanced</button>
        </div>
        <span class="kw-muted etc-mode-hint" data-etc-mode-hint="simple">Pick a telescope and a target, then the SNR you need or the frames you plan: it works out the frames, or the SNR they reach.</span>
        <span class="kw-muted etc-mode-hint" data-etc-mode-hint="advanced" hidden>Every CASTOR input, the full noise budget and a time sweep.</span>
    </div>

<!--CASTOR_ETC_SIMPLE_BODY-->

    <div class="etc-advanced" id="etc-advanced" data-etc-mode-panel="advanced" hidden>
<!--CASTOR_ETC_BODY-->
    </div>
</div>

</body>
</html>
